name: Build
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch: ~

permissions:
  contents: write

env:
  SOURCE_DIR: ${{github.workspace}}
  QT_VERSION: 6.8

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{matrix.system.os}}
    strategy:
      fail-fast: false
      matrix:
        system:
          - os: ubuntu-latest
            artifact_name: linux
            cmake_preset: release
            cpack_generator: "DEB;RPM;TGZ"
            binary_dir: "build-release"
          - os: windows-latest
            artifact_name: windows-x86_64
            cmake_preset: release-win-mingw
            cpack_generator: "NSIS;ZIP"
            binary_dir: "build-release-win"
            qt_arch: win64_mingw
            qt_tools: tools_mingw1310

    steps:
      #######################
      # SETUP
      #######################
      - uses: actions/checkout@v4

      - name: Install System Packages (Linux)
        if: ${{runner.os == 'Linux'}}
        run: |
          sudo apt-get update
          sudo apt-get -y install qt6-base-dev libqt6svg6-dev qt6-tools-dev libglx-dev libgl1-mesa-dev

      - name: Install System Packages (Windows)
        if: ${{runner.os == 'Windows'}}
        run: |
          choco install nsis.portable -y

      - name: Install Qt
        # Don't need this on Linux, as Qt will come from the system package manager above
        if: ${{runner.os != 'Linux'}}
        uses: jurplel/install-qt-action@v4
        with:
          dir: ${{github.workspace}}/.qt
          version: ${{env.QT_VERSION}}
          arch: ${{matrix.system.qt_arch}}
          cache: true
          tools: ${{matrix.system.qt_tools}}
          add-tools-to-path: true

      #######################
      # BUILD
      #######################
      - name: Configure CMake
        run: >
          cmake
          -G Ninja
          -S "${{github.workspace}}"
          -B "${{matrix.system.binary_dir}}"
          --preset=${{matrix.system.cmake_preset}}
          -DCMAKE_INSTALL_PREFIX="${BUILD_DIR}/install_root"
          -DBUILD_PACKAGE=On

      - name: Build
        run: cmake --build "${{matrix.system.binary_dir}}"

      #######################
      # PACKAGE
      #######################
      - name: Package
        working-directory: ${{matrix.system.binary_dir}}
        run: cpack -G "${{matrix.system.cpack_generator}}" -B "./packages"

      - name: Upload failed package artifacts
        uses: actions/upload-artifact@v4
        if: ${{failure()}}
        with:
          name: failed-packages-${{matrix.system.artifact_name}}
          path: ${{matrix.system.binary_dir}}/packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{matrix.system.artifact_name}}
          path: ${{matrix.system.binary_dir}}/packages/*.*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: packages-windows-x86_64
          path: release-assets

      - name: Publish Windows installer and portable package
        env:
          GH_TOKEN: ${{github.token}}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*.exe
          release-assets/*.zip
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "FnSolver 简体中文版 ${GITHUB_REF_NAME}"
